name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dekleptocracy-website

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dekleptocracy-website/package-lock.json

      - run: npm ci

      - run: npm run lint --prefix client
      - run: npm run lint --prefix server

  build-client:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      contains(toJSON(github.event.commits.*.modified), 'dekleptocracy-website/client/') ||
      contains(toJSON(github.event.commits.*.added), 'dekleptocracy-website/client/') ||
      contains(toJSON(github.event.commits.*.modified), '.github/workflows/test.yml')
    defaults:
      run:
        working-directory: dekleptocracy-website

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dekleptocracy-website/package-lock.json

      - run: npm ci

      - run: npm run build --prefix client

  test:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      contains(toJSON(github.event.commits.*.modified), 'dekleptocracy-website/server/') ||
      contains(toJSON(github.event.commits.*.added), 'dekleptocracy-website/server/') ||
      contains(toJSON(github.event.commits.*.modified), '.github/workflows/test.yml')
    defaults:
      run:
        working-directory: dekleptocracy-website

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dekleptocracy-website/package-lock.json

      - run: npm ci

      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: npm test --prefix server
        env:
          JWT_SECRET: ci-test-secret
          GOOGLE_CLIENT_ID: ci-test-google-id
          NODE_ENV: test
