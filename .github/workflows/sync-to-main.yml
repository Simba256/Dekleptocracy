name: Sync to Main

on:
  push:
    branches:
      - claude/explore-codebase-011CUpRksi6kabgyLY1LBiwN

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync to main
        run: |
          git fetch origin main || git fetch origin
          git checkout main || git checkout -b main
          git merge --ff-only origin/claude/explore-codebase-011CUpRksi6kabgyLY1LBiwN || \
            git merge origin/claude/explore-codebase-011CUpRksi6kabgyLY1LBiwN
          git push origin main
